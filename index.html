tb.innerHTML='<span style="opacity:.5">갱신중...</span>';
a.innerHTML='<div class="ld"><div class="sp"></div><p style="margin-top:16px;font-weight:300;font-size:.85rem">로딩중...</p></div>';
nb.style.display='none';
try{
const [qRes,nRes,dRes]=await Promise.all([fetch("/api/quotes"),fetch("/api/news/headlines"),fetch("/api/dram")]);
const j=await qRes.json(),rs=j.quoteResponse?.result||[];
const dData=await dRes.json();
if(!rs.length)throw Error("no data");
let idx=0;
CATS.forEach(cat=>{
const sec=document.createElement("section");sec.className="cat-section";
sec.innerHTML='<h3 class="cat-title"><span class="cat-icon">'+cat.icon+'</span>'+cat.name+'</h3><div class="grid"></div>';
const grid=sec.querySelector(".grid");
if(cat.id==="dram"){
if(dData.categories&&dData.categories.length){
const tableWrap=document.createElement("div");
tableWrap.className="dram-table-wrap";
let html='<div class="dram-categories">';
dData.categories.forEach(cat=>{
html+='<div class="dram-category"><strong>'+cat.name+'</strong>';
if(cat.updateTime) html+=' <small>'+cat.updateTime+'</small>';
html+=' <span style="color:rgba(255,255,255,.4);font-size:.8em">'+cat.note+'</span></div>';
});
html+='</div>';
if(dData.globalUpdate) html+='<div class="dram-update">'+dData.globalUpdate+'</div>';
tableWrap.innerHTML=html;
sec.appendChild(tableWrap);
}
a.appendChild(sec);
return;
}
cat.items.forEach(x=>{
const d=rs.find(r=>r.symbol===x.t||r.symbol===x.t.replace("^","%5E"));
const c=document.createElement("a");c.className="card";c.href="detail.html?s="+encodeURIComponent(x.t);
c.style.animationDelay=(0.06*idx+++0.4)+'s';
if(!d){c.innerHTML='<div class="label">'+x.e+' '+x.l+'</div><div style="color:rgba(255,255,255,.2)">-</div>';grid.appendChild(c);return}
const h=x.h||1,p=d.priceKrw*h,ch=d.changeKrw*h,cp=d.changePercentKrw,pc=d.previousCloseKrw*h;
c.innerHTML='<div class="label">'+x.e+' '+x.l+'</div><div class="price"><span class="won">₩</span>'+fmt(p)+'</div><div class="change '+(ch>=0?"up":"down")+'">'+(ch>=0?"▲":"▼")+' '+(ch>=0?"+":"")+fmt(ch)+' ('+(cp>=0?"+":"")+cp.toFixed(2)+'%)</div><div class="prev">전일: ₩'+(pc?fmt(pc):"-")+'</div>';
grid.appendChild(c)});
a.appendChild(sec)});
tb.innerHTML='<span>'+new Date().toLocaleTimeString("ko-KR")+'</span>';
if(nRes.ok){const nd=await nRes.json();if(nd.news&&nd.news.length){nl.innerHTML=nd.news.slice(0,7).map(n=>'<div class="news-item"><a class="n-title" href="'+(n.link||'#')+'" target="_blank" rel="noopener">'+(n.title||'')+'</a><div class="n-meta">'+(n.publisher||'')+' · '+tf(n.time)+'</div></div>').join('');nb.style.display='block'}}
}catch(e){a.innerHTML='<div class="ld"><p style="color:#f85149;font-weight:500">불러오기 실패</p><p style="margin-top:8px;font-weight:300;font-size:.85rem">'+e.message+'</p><button class="btn" style="margin-top:20px" onclick="f()">다시시도</button></div>';tb.innerHTML='<span style="opacity:.5">오류</span>'}
}
f();setInterval(f,30000);
</script>
