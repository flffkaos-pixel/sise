<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0C0C0C"/>
      <stop offset="100%" stop-color="#1A1A1A"/>
    </linearGradient>
    <linearGradient id="t" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#646973"/>
      <stop offset="100%" stop-color="#BBCCD7"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#g)"/>
  <!-- Grid pattern -->
  <g opacity=".03" stroke="#FFFFFF" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105"/><line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/><line x1="0" y1="420" x2="1200" y2="420"/><line x1="0" y1="525" x2="1200" y2="525"/>
  </g>
  <!-- Card frame -->
  <rect x="60" y="60" width="1080" height="510" rx="24" fill="none" stroke="rgba(255,255,255,.06)" stroke-width="1"/>
  <!-- Title -->
  <text x="600" y="300" font-family="Arial,Helvetica,sans-serif" font-weight="900" font-size="140" fill="url(#t)" text-anchor="middle" letter-spacing="-3">모두의 시세</text>
  <!-- Subtitle -->
  <text x="600" y="390" font-family="Arial,Helvetica,sans-serif" font-weight="300" font-size="44" fill="rgba(255,255,255,.35)" text-anchor="middle" letter-spacing="4">실시간 글로벌 금융 시세 · 원화 기준</text>
  <!-- Bottom tags -->
  <rect x="340" y="440" width="100" height="36" rx="18" fill="rgba(255,255,255,.04)"/>
  <text x="390" y="464" font-family="Arial,Helvetica,sans-serif" font-weight="500" font-size="18" fill="rgba(255,255,255,.3)" text-anchor="middle">54종목</text>
  <rect x="460" y="440" width="120" height="36" rx="18" fill="rgba(255,255,255,.04)"/>
  <text x="520" y="464" font-family="Arial,Helvetica,sans-serif" font-weight="500" font-size="18" fill="rgba(255,255,255,.3)" text-anchor="middle">30초 갱신</text>
  <rect x="600" y="440" width="120" height="36" rx="18" fill="rgba(255,255,255,.04)"/>
  <text x="660" y="464" font-family="Arial,Helvetica,sans-serif" font-weight="500" font-size="18" fill="rgba(255,255,255,.3)" text-anchor="middle">차트·예측</text>
  <rect x="740" y="440" width="120" height="36" rx="18" fill="rgba(255,255,255,.04)"/>
  <text x="800" y="464" font-family="Arial,Helvetica,sans-serif" font-weight="500" font-size="18" fill="rgba(255,255,255,.3)" text-anchor="middle">금융뉴스</text>
  <!-- ₩ symbol watermark -->
  <text x="1100" y="560" font-family="Arial,Helvetica,sans-serif" font-weight="900" font-size="120" fill="rgba(255,255,255,.02)" text-anchor="end">₩</text>
</svg>
