<script>
let chartInst=null;
function fmt(n){return Math.round(n).toLocaleString()}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function cv(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim()}
function hexRgba(h,a){h=h.replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');const n=parseInt(h,16);return 'rgba('+((n>>16)&255)+','+((n>>8)&255)+','+(n&255)+','+a+')'}
function chartColors(){
  return{line:cv('--chart-line'),fill:hexRgba(cv('--chart-line'),0.12),grid:cv('--grid'),tick:cv('--dim'),tipBg:cv('--surface2'),tipBorder:cv('--border'),tipTitle:cv('--muted'),tipBody:cv('--fg')}
}
function predictLR(data){
  const n=data.length;if(n<3)return null;
  let sx=0,sy=0,sxy=0,sx2=0;
  for(let i=0;i<n;i++){sx+=i;sy+=data[i];sxy+=i*data[i];sx2+=i*i}
  const b=(n*sxy-sx*sy)/(n*sx2-sx*sx);
  const a=(sy-b*sx)/n;
  const pred=a+b*n;
  const avg=sy/n;
  const ssTot=data.reduce((s,v)=>s+(v-avg)**2,0);
  const ssRes=data.reduce((s,v,i)=>s+(v-(a+b*i))**2,0);
  const r2=1-(ssRes/ssTot);
  const last=data[n-1];
  return {pred,slope:b,intercept:a,r2:Math.max(0,r2),direction:pred>=last?'up':'down',change:pred-last,changePct:((pred-last)/last)*100};
}
function makeChart(canvas,labels,closes,iy){
  const c=chartColors();
  chartInst=new Chart(canvas,{type:'line',data:{labels,datasets:[{data:closes,borderColor:c.line,backgroundColor:c.fill,borderWidth:2,pointRadius:0,pointHitRadius:10,tension:.3,fill:true}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{backgroundColor:c.tipBg,titleColor:c.tipTitle,bodyColor:c.tipBody,borderColor:c.tipBorder,borderWidth:1,padding:12,cornerRadius:6,callbacks:{label:ctx=>(iy?'':'₩')+fmt(ctx.parsed.y)}}},scales:{x:{display:true,grid:{color:c.grid},ticks:{color:c.tick,font:{size:10},maxTicksLimit:8}},y:{display:true,grid:{color:c.grid},ticks:{color:c.tick,font:{size:10},callback:v=>(iy?'':'₩')+fmt(v)}}},interaction:{mode:'index',intersect:false}}});
}
function renderButton(label){
  return '<div style="text-align:center;padding:36px 0 10px"><button class="btn ghost" onclick="load()">새로고침</button></div>';
}
window.__onTheme=function(){if(window.__sym)load()};

const params=new URLSearchParams(window.location.search);
const symbol=params.get('s');
window.__sym=symbol;
const KR_ITEMS={
  'KR_PURE_BUY':{label:'순금 1돈',field:'pureBuy',chg:'pureBuyChg',chgPct:'pureBuyChgPct',mode:'살 때'},
  'KR_PURE_SELL':{label:'순금 1돈',field:'pureSell',chg:'pureSellChg',chgPct:'pureSellChgPct',mode:'팔 때'},
  'KR_18K_BUY':{label:'18K 1돈',field:'k18Buy',chg:'k18BuyChg',chgPct:'k18BuyChgPct',mode:'살 때'},
  'KR_14K_BUY':{label:'14K 1돈',field:'k14Buy',chg:'k14BuyChg',chgPct:'k14BuyChgPct',mode:'살 때'}
};
const krItem=KR_ITEMS[symbol]||null;
const JPN=symbol==='JPYKRW=X';
const lb=JPN?'100엔당':'';
const iy=symbol.startsWith('^');
if(!symbol){document.getElementById('root').innerHTML='<div class="ld"><p style="font-weight:700;color:var(--down)">잘못된 접근</p><p style="margin-top:8px;font-size:13px">시세를 선택해주세요</p><a href="/" class="btn" style="display:inline-block;margin-top:20px">돌아가기</a></div>'}else load();

async function loadKr(root){
  try{
    const [krRes,histRes]=await Promise.all([fetch('/api/krgold'),fetch('/api/history?symbol='+encodeURIComponent('GC=F')).catch(()=>null)]);
    if(!krRes.ok)throw Error('fetch failed');
    const g=await krRes.json();
    if(!g||!g[krItem.field])throw Error('no data');
    const v=g[krItem.field],ch=g[krItem.chg]||0,cp=g[krItem.chgPct]||0,pc=v-ch;
    const isUp=ch>=0;
    const d=histRes&&histRes.ok?await histRes.json():null;
    const closes=(d&&d.history)?d.history.map(hh=>hh.close).filter(c=>c>0):[];
    const labels=(d&&d.history)?d.history.map(hh=>{const dt=new Date(hh.date*1000);return dt.getMonth()+1+'/'+dt.getDate()}):[];
    const hasChart=closes.length>1;
    const pred=hasChart?predictLR(closes):null;
    const intlPerGram=(d&&d.currentPrice)?d.currentPrice/31.1035:0;
    const krPurePerGram=(g.pureBuy||0)/3.75;
    const premium=intlPerGram&&krPurePerGram?((krPurePerGram/intlPerGram)-1)*100:null;
    const allRows=[['순금','pureBuy','pureSell'],['18K','k18Buy','k18Sell'],['14K','k14Buy','k14Sell'],['은','silverBuy','silverSell']];
    const allHtml='<div class="box"><h2>국내 귀금속 고시가 — 한눈에 보기</h2><p class="sub">한국금거래소 고시 · 1돈(3.75g) 기준 · '+(g.date?g.date.split(' ')[0]:'')+'</p><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px">'+allRows.map(r=>'<div style="background:var(--surface2);border:1px solid var(--border);border-radius:var(--box-radius);padding:12px 14px"><div style="font-size:11px;font-weight:700;color:var(--dim);letter-spacing:.06em;margin-bottom:6px">'+r[0]+'</div><div style="font-size:14px;line-height:1.9"><span style="color:var(--dim);font-weight:600;margin-right:4px">살 때</span><b>₩'+fmt(g[r[1]]||0)+'</b></div><div style="font-size:14px;line-height:1.9"><span style="color:var(--dim);font-weight:600;margin-right:4px">팔 때</span><b>₩'+fmt(g[r[2]]||0)+'</b></div></div>').join('')+'</div></div>';
    root.innerHTML=
      '<div class="price-box" itemscope itemtype="https://schema.org/FinancialProduct">'+
        '<div class="label" itemprop="name"><span style="background:var(--accent-soft);color:var(--accent);padding:2px 9px;border-radius:6px;margin-right:8px;font-size:11px">한국시세</span>'+krItem.label+' ('+krItem.mode+')</div>'+
        '<h2 style="font-size:0;position:absolute;visibility:hidden">국내 '+krItem.label+' '+krItem.mode+' 시세는 얼마인가요?</h2>'+
        '<div class="price"><span class="won">₩</span>'+fmt(v)+'</div>'+
        '<div class="change '+(isUp?'up':'down')+'">'+(isUp?'+':'-')+' '+fmt(Math.abs(ch))+' ('+(cp>=0?'+':'')+cp.toFixed(2)+'%)</div>'+
        '<div class="prev">전일: ₩'+fmt(pc)+'</div>'+
      '</div>'+
      allHtml+
      (hasChart?'<div class="chart-wrap"><h2>국제 금(GC=F) 30일 등락 추이 — 국내 고시가 방향 참고지표</h2><p class="sub">국내 금 고시가는 국제 금 가격과 밀접하게 연동됩니다. 최근 30일 국제 금(원/트로이온스) 추이입니다.</p><canvas id="chart"></canvas></div>':'')+
      (pred?'<div class="pred-box"><h2>등락예상 — 국제 금 동향으로 본 내일 국내 고시가 전망</h2><p class="sub">국제 금(GC=F) 30일 선형회귀 기반 예측 (R² 신뢰도) — 국내 고시가 방향의 참고 지표</p><div class="pred-dir '+(pred.direction==='up'?'up':'down')+'">'+(pred.direction==='up'?'상승 예상':'하락 예상')+'</div><div class="pred-price"><span class="won">₩</span>'+fmt(pred.pred)+'</div><div class="pred-detail">'+(pred.change>=0?'+':'')+fmt(pred.change)+' ('+(pred.changePct>=0?'+':'')+pred.changePct.toFixed(2)+'%) · 신뢰도 '+(pred.r2*100).toFixed(0)+'%</div><div class="pred-bar-wrap"><div class="pred-bar"><div class="pred-bar-fill" style="width:'+(pred.r2*100)+'%;background:'+(pred.direction==='up'?'var(--up)':'var(--down)')+'"></div></div></div></div>':'')+
      (premium?'<div class="box" style="background:var(--accent-soft);border-color:var(--accent)"><b>국내 소매가 vs 국제가:</b> 국내 순금 1돈(3.75g) 살 때 가격은 국제 금(원/그램 환산) 대비 약 <b style="color:var(--accent)">'+(premium>=0?'+':'')+premium.toFixed(0)+'%</b> 높습니다. 국내 소매가에는 부가세와 유통 프리미엄이 포함되어 국제 현물가보다 비싸게 책정됩니다.</div>':'')+
      renderButton();
    if(hasChart)makeChart(document.getElementById('chart'),labels,closes,false);
  }catch(e){
    root.innerHTML='<div class="ld"><p style="font-weight:700;color:var(--down)">불러오기 실패</p><p style="margin-top:8px;font-size:13px">'+esc(e.message)+'</p><button class="btn" style="margin-top:20px" onclick="load()">다시시도</button></div>';
  }
}

async function load(){
  const root=document.getElementById('root');
  if(chartInst){try{chartInst.destroy()}catch(e){}chartInst=null}
  try{
    if(krItem){return await loadKr(root)}
    const histRes=await fetch('/api/history?symbol='+encodeURIComponent(symbol));
    if(!histRes.ok)throw Error('fetch failed');
    const d=await histRes.json();
    const h=JPN?100:1;
    const cur=d.currentPrice*h,chg=d.change*h,pc=d.previousClose*h;
    const isUp=d.change>=0;
    const assetLabel=d.shortName||symbol;
    const hasChart=d.history&&d.history.length>1;
    const closes=hasChart?d.history.map(hh=>hh.close*h).filter(c=>c>0):[];
    const labels=hasChart?d.history.map(hh=>{const dt=new Date(hh.date*1000);return dt.getMonth()+1+'/'+dt.getDate()}):[];
    const pred=hasChart?predictLR(closes):null;
    const chartHtml=hasChart
      ?'<div class="chart-wrap"><h2>30일 등락 추이 — '+(lb+(assetLabel))+' 가격은 어떻게 변했나요?</h2><p class="sub">최근 30일간 일별 종가 기준 (Chart.js 라인 차트)</p><canvas id="chart"></canvas></div>'
      :'<div class="chart-wrap"><h2>30일 등락 추이 — '+(lb+(assetLabel))+'</h2><p class="sub">차트 데이터를 불러올 수 없습니다 (Yahoo Finance 데이터 제한)</p></div>';
    root.innerHTML=
      '<div class="price-box" itemscope itemtype="https://schema.org/FinancialProduct">'+
        '<div class="label" itemprop="name">'+(lb+(assetLabel))+'</div>'+
        '<h2 style="font-size:0;position:absolute;visibility:hidden">'+assetLabel+' 현재 시세는 얼마인가요?</h2>'+
        '<div class="price">'+(iy?'':'<span class="won">₩</span>')+fmt(cur)+'</div>'+
        '<div class="change '+(isUp?'up':'down')+'">'+(isUp?'+':'-')+' '+fmt(Math.abs(chg))+' ('+(d.changePercent>=0?'+':'')+d.changePercent.toFixed(2)+'%)</div>'+
        '<div class="prev">전일: '+(iy?'':'₩')+fmt(pc)+'</div>'+
      '</div>'+
      chartHtml+
      (pred?'<div class="pred-box">'+
        '<h2>내일 예상 — '+(lb+(assetLabel))+' 내일 가격은 어떻게 될까요?</h2>'+
        '<p class="sub">30일 선형회귀 분석 기반 예측 (R² 신뢰도)</p>'+
        '<div class="pred-dir '+(pred.direction==='up'?'up':'down')+'">'+(pred.direction==='up'?'상승 예상':'하락 예상')+'</div>'+
        '<div class="pred-price">'+(iy?'':'<span class="won">₩</span>')+fmt(pred.pred)+'</div>'+
        '<div class="pred-detail">'+(pred.change>=0?'+':'')+fmt(pred.change)+' ('+(pred.changePct>=0?'+':'')+pred.changePct.toFixed(2)+'%) · 신뢰도 '+(pred.r2*100).toFixed(0)+'%</div>'+
        '<div class="pred-bar-wrap"><div class="pred-bar"><div class="pred-bar-fill" style="width:'+(pred.r2*100)+'%;background:'+(pred.direction==='up'?'var(--up)':'var(--down)')+'"></div></div></div>'+
      '</div>':'')+
      renderButton();
    if(hasChart)makeChart(document.getElementById('chart'),labels,closes,iy);
  }catch(e){
    root.innerHTML='<div class="ld"><p style="font-weight:700;color:var(--down)">불러오기 실패</p><p style="margin-top:8px;font-size:13px">'+esc(e.message)+'</p><button class="btn" style="margin-top:20px" onclick="load()">다시시도</button></div>';
  }
}
</script>
