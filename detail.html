<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>모두의 시세 - 상세</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#0C0C0C;font-family:'Kanit',sans-serif;color:#D7E2EA;min-height:100vh;overflow-x:clip}
.wrap{max-width:960px;margin:0 auto;padding:32px 24px}
.hero-heading{background:linear-gradient(180deg,#646973 0%,#BBCCD7 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.top-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:32px;animation:fadeUp .6s cubic-bezier(.25,.1,.25,1) both}
.top-bar a{color:#8b949e;font-weight:300;font-size:clamp(.75rem,1.1vw,.85rem);text-decoration:none;text-transform:uppercase;letter-spacing:.1em;transition:color .2s}
.top-bar a:hover{color:#D7E2EA}
.price-box{text-align:center;padding:clamp(24px,4vw,48px) 0;animation:fadeUp .6s cubic-bezier(.25,.1,.25,1) both;animation-delay:.1s}
.price-box .icon{font-size:clamp(2rem,5vw,3.5rem);margin-bottom:8px}
.price-box .label{font-weight:500;font-size:clamp(.75rem,1.2vw,.9rem);text-transform:uppercase;letter-spacing:.15em;color:rgba(215,226,234,.35);margin-bottom:12px}
.price-box .price{font-size:clamp(2.5rem,8vw,5rem);font-weight:800;letter-spacing:-2px;line-height:1;color:#BBCCD7}
.price-box .price .won{font-weight:300;font-size:.45em;color:rgba(215,226,234,.25);margin-right:4px;vertical-align:top}
.price-box .change{font-size:clamp(1rem,2vw,1.5rem);font-weight:500;margin-top:10px}
.price-box .prev{font-weight:300;font-size:clamp(.7rem,1vw,.8rem);color:rgba(215,226,234,.25);margin-top:16px;letter-spacing:.03em}
.up{color:#3fb950}.down{color:#f85149}
.chart-wrap{background:rgba(255,255,255,.015);border:1px solid rgba(215,226,234,.06);border-radius:20px;padding:clamp(16px,2vw,28px);margin:24px 0;animation:fadeUp .6s cubic-bezier(.25,.1,.25,1) both;animation-delay:.3s}
.chart-wrap h2{font-weight:500;font-size:clamp(.7rem,1.1vw,.8rem);text-transform:uppercase;letter-spacing:.1em;color:rgba(215,226,234,.3);margin-bottom:16px}
#chart{max-height:320px}
.pred-box{background:rgba(255,255,255,.025);border:1px solid rgba(215,226,234,.06);border-radius:20px;padding:clamp(20px,3vw,36px);text-align:center;animation:fadeUp .6s cubic-bezier(.25,.1,.25,1) both;animation-delay:.45s}
.pred-box h2{font-weight:500;font-size:clamp(.7rem,1.1vw,.8rem);text-transform:uppercase;letter-spacing:.1em;color:rgba(215,226,234,.3);margin-bottom:20px}
.pred-box .pred-dir{font-size:clamp(1.2rem,2.5vw,2rem);font-weight:700;margin-bottom:6px}
.pred-box .pred-price{font-size:clamp(1.8rem,4vw,3rem);font-weight:800;letter-spacing:-1px;color:#BBCCD7}
.pred-box .pred-price .won{font-weight:300;font-size:.5em;color:rgba(215,226,234,.25);margin-right:3px}
.pred-box .pred-detail{font-weight:300;font-size:clamp(.7rem,1vw,.8rem);color:rgba(215,226,234,.25);margin-top:12px}
.pred-box .pred-bar-wrap{margin-top:16px;max-width:200px;margin-left:auto;margin-right:auto}
.pred-box .pred-bar{height:4px;border-radius:4px;overflow:hidden;background:rgba(215,226,234,.06)}
.pred-box .pred-bar-fill{height:100%;border-radius:4px;transition:width 1s cubic-bezier(.25,.1,.25,1)}
.news-box{background:rgba(255,255,255,.015);border:1px solid rgba(215,226,234,.06);border-radius:20px;padding:clamp(16px,2vw,28px);margin:24px 0;animation:fadeUp .6s cubic-bezier(.25,.1,.25,1) both;animation-delay:.55s}
.news-box h2{font-weight:500;font-size:clamp(.7rem,1.1vw,.8rem);text-transform:uppercase;letter-spacing:.1em;color:rgba(215,226,234,.3);margin-bottom:16px}
.news-item{padding:14px 0;border-bottom:1px solid rgba(215,226,234,.04)}
.news-item:last-child{border-bottom:none;padding-bottom:0}
.news-item .n-title{font-weight:500;font-size:clamp(.8rem,1.2vw,.95rem);color:#D7E2EA;text-decoration:none;display:block;line-height:1.4;transition:opacity .2s}
.news-item .n-title:hover{opacity:.7}
.news-item .n-meta{font-weight:300;font-size:clamp(.6rem,.8vw,.7rem);color:rgba(215,226,234,.3);margin-top:6px}
.news-item .n-summary{font-weight:300;font-size:clamp(.65rem,.9vw,.75rem);color:rgba(215,226,234,.4);margin-top:4px;line-height:1.3}
.news-empty{padding:40px 0;text-align:center;font-weight:300;font-size:clamp(.7rem,1vw,.8rem);color:rgba(215,226,234,.2)}
.ld{text-align:center;padding:100px 0;color:rgba(215,226,234,.3)}
.sp{width:28px;height:28px;border:2px solid rgba(215,226,234,.06);border-top-color:#BBCCD7;border-radius:50%;animation:spin .8s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:600px){.wrap{padding:20px 14px}.price-box .price{font-size:clamp(2rem,10vw,3.5rem)}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top-bar">
    <a href="/">&larr; 뒤로</a>
    <span class="badge" style="font-weight:500;font-size:clamp(.6rem,.9vw,.7rem);text-transform:uppercase;letter-spacing:.12em;padding:4px 14px;border:1px solid rgba(215,226,234,.12);border-radius:999px;color:rgba(215,226,234,.5)">Yahoo Finance</span>
  </div>
  <div id="root">
    <div class="ld"><div class="sp"></div><p style="margin-top:16px;font-weight:300;font-size:.85rem">불러오는 중...</p></div>
  </div>
</div>
<script>
function fmt(n){return Math.round(n).toLocaleString()}
function predictLR(data){
  const n=data.length;if(n<3)return null;
  let sx=0,sy=0,sxy=0,sx2=0;
  for(let i=0;i<n;i++){sx+=i;sy+=data[i];sxy+=i*data[i];sx2+=i*i}
  const b=(n*sxy-sx*sy)/(n*sx2-sx*sx);
  const a=(sy-b*sx)/n;
  const pred=a+b*n;
  const avg=sy/n;
  const ssTot=data.reduce((s,v)=>s+(v-avg)**2,0);
  const ssRes=data.reduce((s,v,i)=>s+(v-(a+b*i))**2,0);
  const r2=1-(ssRes/ssTot);
  const last=data[n-1];
  return {pred,slope:b,intercept:a,r2:Math.max(0,r2),direction:pred>=last?'up':'down',change:pred-last,changePct:((pred-last)/last)*100};
}
function timeAgo(dateStr){
  const d=new Date(dateStr),n=new Date(),diff=Math.floor((n-d)/1000);
  if(diff<60)return'방금 전';
  if(diff<3600)return Math.floor(diff/60)+'분 전';
  if(diff<86400)return Math.floor(diff/3600)+'시간 전';
  return Math.floor(diff/86400)+'일 전';
}
function truncate(s,n){return s&&s.length>n?s.slice(0,n)+'...':s||''}

const params=new URLSearchParams(window.location.search);
const symbol=params.get('s');
if(!symbol){document.getElementById('root').innerHTML='<div class="ld"><p style="color:#f85149;font-weight:500">잘못된 접근</p><p style="margin-top:8px;font-weight:300;font-size:.85rem">시세를 선택해주세요</p><a href="/" class="btn" style="display:inline-block;margin-top:20px;font-family:Kanit,sans-serif;font-weight:500;text-transform:uppercase;letter-spacing:.12em;padding:10px 32px;background:rgba(255,255,255,.03);color:#D7E2EA;border:1px solid rgba(215,226,234,.1);border-radius:999px;cursor:pointer;font-size:clamp(.65rem,.9vw,.75rem);text-decoration:none">돌아가기</a></div>'}else load();

async function load(){
  const root=document.getElementById('root');
  try{
    const [histRes,newsRes]=await Promise.all([
      fetch('/api/history?symbol='+encodeURIComponent(symbol)),
      fetch('/api/news?symbol='+encodeURIComponent(symbol))
    ]);
    if(!histRes.ok)throw Error('fetch failed');
    const d=await histRes.json();
    const news=newsRes.ok?await newsRes.json():{news:[]};
    if(!d.history||d.history.length<2)throw Error('insufficient data');
    const closes=d.history.map(h=>h.close).filter(c=>c>0);
    const labels=d.history.map(h=>{const dt=new Date(h.date*1000);return dt.getMonth()+1+'/'+dt.getDate()});
    const pred=predictLR(closes);
    const isUp=d.change>=0;
    const newsHtml=news.news&&news.news.length?
      news.news.map(n=>'<div class="news-item"><a class="n-title" href="'+(n.link||'#')+'" target="_blank" rel="noopener">'+(n.title||'')+'</a><div class="n-meta">'+(n.publisher||n.provider||'')+'</div>'+(n.summary?'<div class="n-summary">'+truncate(n.summary,120)+'</div>':'')+'</div>').join('')
      :'<div class="news-empty">관련 뉴스가 없습니다</div>';
    root.innerHTML=
      '<div class="price-box">'+
        '<div class="icon">'+(d.icon||'')+'</div>'+
        '<div class="label">'+(d.shortName||symbol)+'</div>'+
        '<div class="price"><span class="won">₩</span>'+fmt(d.currentPrice)+'</div>'+
        '<div class="change '+(isUp?'up':'down')+'">'+(isUp?'▲':'▼')+' '+fmt(Math.abs(d.change))+' ('+(d.changePercent>=0?'+':'')+d.changePercent.toFixed(2)+'%)</div>'+
        '<div class="prev">전일: ₩'+fmt(d.previousClose)+'</div>'+
      '</div>'+
      '<div class="chart-wrap">'+
        '<h2>30일 등락 추이</h2>'+
        '<canvas id="chart"></canvas>'+
      '</div>'+
      (pred?'<div class="pred-box">'+
        '<h2>내일 예상</h2>'+
        '<div class="pred-dir '+(pred.direction==='up'?'up':'down')+'">'+(pred.direction==='up'?'▲ 상승 예상':'▼ 하락 예상')+'</div>'+
        '<div class="pred-price"><span class="won">₩</span>'+fmt(pred.pred)+'</div>'+
        '<div class="pred-detail">'+(pred.change>=0?'+':'')+fmt(pred.change)+' ('+(pred.changePct>=0?'+':'')+pred.changePct.toFixed(2)+'%) · 신뢰도 '+(pred.r2*100).toFixed(0)+'%</div>'+
        '<div class="pred-bar-wrap"><div class="pred-bar"><div class="pred-bar-fill" style="width:'+(pred.r2*100)+'%;background:'+(pred.direction==='up'?'#3fb950':'#f85149')+'"></div></div></div>'+
      '</div>':'')+
      '<div class="news-box">'+
        '<h2>최신 뉴스</h2>'+
        newsHtml+
      '</div>'+
      '<div class="ft" style="text-align:center;padding:40px 0 20px;animation:fadeUp .6s both;animation-delay:.6s">'+
        '<button class="btn" onclick="load()" style="font-family:Kanit,sans-serif;font-weight:500;text-transform:uppercase;letter-spacing:.12em;padding:10px 32px;background:rgba(255,255,255,.03);color:#D7E2EA;border:1px solid rgba(215,226,234,.1);border-radius:999px;cursor:pointer;font-size:clamp(.65rem,.9vw,.75rem);transition:all .3s">새로고침</button>'+
      '</div>';
    const ctx=document.getElementById('chart').getContext('2d');
    new Chart(ctx,{
      type:'line',
      data:{
        labels,
        datasets:[{
          data:closes,
          borderColor:'#BBCCD7',
          backgroundColor:'rgba(187,204,215,.08)',
          borderWidth:2,
          pointRadius:0,
          pointHitRadius:10,
          tension:.3,
          fill:true
        }]
      },
      options:{
        responsive:true,
        maintainAspectRatio:false,
        plugins:{legend:{display:false},tooltip:{backgroundColor:'rgba(12,12,12,.9)',titleColor:'#8b949e',bodyColor:'#D7E2EA',borderColor:'rgba(215,226,234,.1)',borderWidth:1,padding:12,cornerRadius:8,callbacks:{label:ctx=>'₩'+fmt(ctx.parsed.y)}}},
        scales:{
          x:{display:true,grid:{color:'rgba(215,226,234,.03)'},ticks:{color:'rgba(215,226,234,.2)',font:{family:'Kanit',size:10},maxTicksLimit:8}},
          y:{display:true,grid:{color:'rgba(215,226,234,.05)'},ticks:{color:'rgba(215,226,234,.2)',font:{family:'Kanit',size:10},callback:v=>'₩'+fmt(v)}}
        },
        interaction:{mode:'index',intersect:false}
      }
    });
  }catch(e){
    root.innerHTML='<div class="ld"><p style="color:#f85149;font-weight:500">불러오기 실패</p><p style="margin-top:8px;font-weight:300;font-size:.85rem">'+e.message+'</p><button class="btn" onclick="load()" style="margin-top:20px;font-family:Kanit,sans-serif;font-weight:500;text-transform:uppercase;letter-spacing:.12em;padding:10px 32px;background:rgba(255,255,255,.03);color:#D7E2EA;border:1px solid rgba(215,226,234,.1);border-radius:999px;cursor:pointer;font-size:clamp(.65rem,.9vw,.75rem)">다시시도</button></div>';
  }
}
</script>
</body>
</html>
