<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
<meta name="NaverBot" content="All">
<meta name="Yeti" content="All">
<meta name="naver-site-verification" content="af42f7ca6447323460c4d85e8babb00bb2f31f61">
<meta name="google-site-verification" content="5m9WrjHo6HZ1aRzDjKvDEtLsv1Egv2K2yi-clQ1WHfk">
<title>문의하기 | 모두의 시세</title>
<meta name="description" content="모두의 시세 문의하기 - 서비스 오류 신고, 데이터 오류 제보, 제휴 제안, 개인정보 관련 문의">
<link rel="canonical" href="https://modu-sise.vercel.app/contact.html">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/theme.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:var(--bg);font-family:'Kanit',sans-serif;color:var(--fg);min-height:100vh;line-height:1.7}
.wrap{max-width:640px;margin:0 auto;padding:40px 24px}
header{text-align:center;padding:40px 0 24px}
h1{font-size:clamp(2rem,5vw,3rem);font-weight:700;margin-bottom:16px}
p{font-weight:300;font-size:clamp(.95rem,2vw,1.05rem);color:var(--fg);margin:12px 0}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
footer{text-align:center;padding:40px 0 24px;color:var(--dim);font-size:.9rem}
nav a{margin:0 12px;color:var(--dim)}
nav a:hover{color:var(--fg)}
.form-group{margin-bottom:24px}
label{display:block;font-weight:500;margin-bottom:8px;color:var(--fg)}
input,select,textarea{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 16px;color:var(--fg);font-family:'Kanit',sans-serif;font-size:1rem;transition:border-color .2s,box-shadow .2s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-glow)}
input::placeholder,textarea::placeholder{color:var(--dim)}
textarea{min-height:140px;resize:vertical}
.btn{width:100%;background:linear-gradient(135deg,var(--accent),var(--accent-hover));border:none;border-radius:12px;padding:16px;font-family:'Kanit',sans-serif;font-weight:600;font-size:1rem;color:var(--bg);cursor:pointer;transition:transform .2s,box-shadow .2s}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 24px var(--accent-glow)}
.btn:active{transform:translateY(0)}
.required{color:var(--danger)}
.msg{padding:16px;border-radius:12px;margin-top:24px;display:none}
.msg.success{background:rgba(var(--success-rgb),.15);border:1px solid var(--success);color:var(--success);display:block}
.msg.error{background:rgba(var(--danger-rgb),.15);border:1px solid var(--danger);color:var(--danger);display:block}
.contact-info{background:var(--surface2);border:1px solid var(--border);border-radius:16px;padding:24px;margin-top:40px}
.contact-info h3{font-weight:500;margin-bottom:16px}
.contact-info p{margin:8px 0;font-size:.95rem}
@media(max-width:600px){.wrap{padding:24px 16px}}
</style>
</head>
<body>
<header class="topbar" style="padding:12px 24px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px">
  <div style="display:flex;align-items:center;gap:16px">
    <a href="/" style="font-weight:700;font-size:1.2rem;color:var(--fg);text-decoration:none">모두의 시세</a>
    <nav class="topbar-tabs" style="display:flex;gap:0;padding:0 10px">
      <a href="/" style="color:var(--fg);font-size:12.5px;font-weight:600;padding:11px 16px;text-decoration:none;white-space:nowrap">홈</a>
      <a href="/oil.html" style="color:var(--fg);font-size:12.5px;font-weight:600;padding:11px 16px;text-decoration:none;white-space:nowrap">기름값</a>
      <a href="/privacy.html" style="color:var(--fg);font-size:12.5px;font-weight:600;padding:11px 16px;text-decoration:none;white-space:nowrap">개인정보처리방침</a>
      <a href="/terms.html" style="color:var(--fg);font-size:12.5px;font-weight:600;padding:11px 16px;text-decoration:none;white-space:nowrap">이용약관</a>
      <a href="/contact.html" style="color:var(--fg);font-size:12.5px;font-weight:600;padding:11px 16px;text-decoration:none;white-space:nowrap">문의하기</a>
    </nav>
  </div>
  <div class="theme-toggle" style="display:flex;gap:8px" aria-label="테마 선택">
    <button type="button" data-theme="vscode" onclick="__setTheme('vscode')" style="padding:8px 14px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--fg);font-size:12px;font-weight:600;cursor:pointer">VS Code</button>
    <button type="button" data-theme="excel" onclick="__setTheme('excel')" style="padding:8px 14px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--fg);font-size:12px;font-weight:600;cursor:pointer">엑셀</button>
  </div>
</header>
<div class="wrap">
<header style="text-align:center;padding:40px 0 24px">
<h1>문의하기</h1>
<p>서비스 이용 중 오류, 데이터 문제, 제휴 제안, 개인정보 관련 문의는 아래 폼을 이용해 주세요.</p>
</header>

<form id="contactForm" novalidate>
<div class="form-group">
<label for="type">문의 유형 <span class="required">*</span></label>
<select id="type" name="type" required>
<option value="">선택하세요</option>
<option value="bug">서비스 오류/버그 신고</option>
<option value="data">데이터 오류/누락 제보</option>
<option value="feature">기능 제안/개선 요청</option>
<option value="partnership">제휴/광고 문의</option>
<option value="privacy">개인정보 관련 문의</option>
<option value="other">기타</option>
</select>
</div>

<div class="form-group">
<label for="email">이메일 (답변 수신용) <span class="required">*</span></label>
<input type="email" id="email" name="email" placeholder="name@example.com" required>
</div>

<div class="form-group">
<label for="subject">제목 <span class="required">*</span></label>
<input type="text" id="subject" name="subject" placeholder="간단히 요약해 주세요" required maxlength="100">
</div>

<div class="form-group">
<label for="message">내용 <span class="required">*</span></label>
<textarea id="message" name="message" placeholder="자세히 적어 주세요 (오류 화면 캡처, 발생 시간, 브라우저 환경 등 포함 시 빠른 처리 가능)" required maxlength="3000"></textarea>
</div>

<button type="submit" class="btn">보내기</button>
</form>

<div id="formMsg" class="msg"></div>

<div class="contact-info">
<h3>기타 연락 채널</h3>
<p><strong>이메일:</strong> <a href="mailto:contact@modu-sise.example.com">contact@modu-sise.example.com</a></p>
<p><strong>개인정보 보호책임자:</strong> <a href="mailto:privacy@modu-sise.example.com">privacy@modu-sise.example.com</a></p>
<p><strong>GitHub Issues:</strong> <a href="https://github.com/flffkaos-pixel/sise/issues" target="_blank" rel="noopener">버그·기능 요청 등록</a></p>
<p><strong>응답 시간:</strong> 평일 기준 1~2일 이내 (주말·공휴일 제외)</p>
</div>
</div>
<footer style="text-align:center;padding:40px 0 24px;color:var(--dim);font-size:.9rem">
<nav>
<a href="/" style="margin:0 12px;color:var(--dim);text-decoration:none">홈</a>
<a href="/privacy.html" style="margin:0 12px;color:var(--dim);text-decoration:none">개인정보처리방침</a>
<a href="/terms.html" style="margin:0 12px;color:var(--dim);text-decoration:none">이용약관</a>
</nav>
<p>© 2025 모두의 시세</p>
</footer>

<script>
document.getElementById('contactForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const msgEl = document.getElementById('formMsg');
  msgEl.className = 'msg';
  msgEl.textContent = '전송 중...';
  msgEl.style.display = 'block';

  const formData = new FormData(e.target);
  const data = Object.fromEntries(formData);

  try {
    const res = await fetch('/api/contact', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data)
    });
    const result = await res.json();
    if (res.ok) {
      msgEl.className = 'msg success';
      msgEl.textContent = '문의가 접수되었습니다. 영업일 기준 1~2일 내 답변 드리겠습니다.';
      e.target.reset();
    } else {
      msgEl.className = 'msg error';
      msgEl.textContent = result.error || '전송 실패. 다시 시도해 주세요.';
    }
  } catch (err) {
    msgEl.className = 'msg error';
    msgEl.textContent = '네트워크 오류. 잠시 후 다시 시도해 주세요.';
  }
});
</script>
</body>
</html>
